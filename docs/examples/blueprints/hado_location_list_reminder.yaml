blueprint:
  domain: automation
  name: HAdo - To-do list reminder on arrival
  author: IT-BAER
  source_url: https://github.com/IT-BAER/hado/blob/main/docs/examples/blueprints/hado_location_list_reminder.yaml
  homeassistant:
    min_version: 2025.6.0
  description: >-
    # <img src="https://raw.githubusercontent.com/IT-BAER/hado/main/ASSETS/logo.png" alt="" width="48" height="48" align="absmiddle"> HAdo


    Notify a person when they arrive at a zone that has matching to-do lists
    with open items. Tapping the notification opens the list in HAdo.


    **Setup:** create a to-do list with the same name as the zone, for example
    the zone "Hardware Store" and the list `todo.hardware_store`. The zone name
    is slugified, so spaces and capitals are fine. The zone "home" works too.


    **Explicit mapping (optional):** pick one or more zones and one or more
    to-do lists to tie them together, whatever they are called. Arriving at any
    of the zones notifies for the lists. For example the zone "SouthTown Plaza"
    can map to the lists Michaels, Home Depot and Marshalls, and the zones
    "Aldi" and "Trader Joe's" can both map to the list Groceries. You get one
    notification listing every mapped list that has open items (one tap button
    per list when there are several). Set the zones and the lists, or leave
    both empty; when empty, the list is found by zone name as described above.


    **Places made of several zones (optional):** a zone is a circle, so a long
    strip plaza can be covered with several overlapping zones, for example
    "Plaza West", "Plaza Center" and "Plaza East". Add a place under *Places*
    with a name, the zones that make it up and the lists for it. Arriving at any
    of its zones notifies for its lists, and moving from one of its zones to
    another does not notify again. Any zone that is not part of a place keeps
    working as described above, so you only need to add the places that need it.


    Create one automation from this blueprint per person. Requires HAdo 1.4.0
    or newer (`hado://list/<entity_id>` deep link) and the Home Assistant
    Companion app.
  input:
    person:
      name: Person
      description: The person whose arrival triggers the reminder
      selector:
        entity:
          filter:
            - domain: person
    notify_device:
      name: Phone to notify
      description: The mobile app device that receives the notification
      selector:
        device:
          filter:
            - integration: mobile_app
    zones:
      name: Zones (optional)
      description: Only react to arrivals at these zones. Leave empty to react to any zone.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: zone
    todo_lists:
      name: To-do lists (optional)
      description: The lists to use for this zone. Leave empty to match a list named after the zone.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: todo
    zone_list_groups:
      name: Places (optional)
      description: >-
        Tie several zones to one set of lists. Useful when a single place is
        covered by more than one zone. Zones that are not part of a place keep
        using the settings above, or the list named after the zone.
      default: []
      selector:
        object:
          multiple: true
          label_field: name
          fields:
            name:
              label: Name (shown as the notification title)
              required: true
              selector:
                text:
            zones:
              label: Zones
              required: true
              selector:
                entity:
                  multiple: true
                  filter:
                    - domain: zone
            lists:
              label: To-do lists
              required: true
              selector:
                entity:
                  multiple: true
                  filter:
                    - domain: todo
    min_items:
      name: Minimum open items
      description: Only count a list when it has at least this many open items
      default: 1
      selector:
        number:
          min: 1
          max: 50
          mode: box

mode: parallel

variables:
  min_items: !input min_items
  zone_entities: !input zones
  zone_slugs: >-
    {{ zone_entities | map('state_attr', 'friendly_name') | map('slugify') | list }}
  mapped_lists: !input todo_lists
  zone_groups: !input zone_list_groups
  group_idx: >-
    {% set ns = namespace(to=-1, prev=-1) %}
    {% for g in zone_groups %}
      {% set slugs = g.zones | map('state_attr', 'friendly_name')
         | reject('none') | map('slugify') | list %}
      {% if ns.to < 0 and (trigger.to_state.state | slugify) in slugs %}
        {% set ns.to = loop.index0 %}
      {% endif %}
      {% if ns.prev < 0 and (trigger.from_state.state | slugify) in slugs %}
        {% set ns.prev = loop.index0 %}
      {% endif %}
    {% endfor %}
    {{ {'to': ns.to, 'prev': ns.prev} }}
  place: >-
    {{ zone_groups[group_idx.to].name if group_idx.to >= 0
       else trigger.to_state.state }}
  todo_entities: >-
    {% if group_idx.to >= 0 %}
      {{ zone_groups[group_idx.to].lists }}
    {% elif mapped_lists %}
      {{ mapped_lists }}
    {% else %}
      {{ ['todo.' ~ (trigger.to_state.state | slugify)] }}
    {% endif %}
  active_lists: >-
    {% set ns = namespace(found=[]) %}
    {% for e in todo_entities %}
      {% if states(e) | int(0) >= (min_items | int(1)) %}
        {% set ns.found = ns.found + [e] %}
      {% endif %}
    {% endfor %}
    {{ ns.found }}

triggers:
  - trigger: state
    entity_id: !input person
    alias: The person changes zone

conditions:
  - alias: Zone actually changed
    condition: template
    value_template: "{{ trigger.from_state.state != trigger.to_state.state }}"
  - alias: Arrived somewhere, not just left
    condition: template
    value_template: "{{ trigger.to_state.state not in ['not_home', 'unknown', 'unavailable'] }}"
  - alias: Not just moving between zones of the same place
    condition: template
    value_template: "{{ group_idx.to < 0 or group_idx.to != group_idx.prev }}"
  - alias: Arrived at one of the chosen zones or places (if any are set)
    condition: template
    value_template: >-
      {{ not zone_entities or group_idx.to >= 0
         or (trigger.to_state.state | slugify) in zone_slugs }}
  - alias: At least one list has enough open items
    condition: template
    value_template: "{{ active_lists | count > 0 }}"

actions:
  - variables:
      summary: >-
        {% set ns = namespace(lines=[]) %}
        {% for e in active_lists %}
          {% set n = states(e) | int(0) %}
          {% set ns.lines = ns.lines + [
            state_attr(e, 'friendly_name') ~ ': ' ~ n ~ ' item'
            ~ ('s' if n != 1 else '')] %}
        {% endfor %}
        {{ ns.lines | join('\n') }}
      buttons: >-
        {% set ns = namespace(b=[]) %}
        {% if active_lists | count > 1 %}
          {% for e in active_lists[:3] %}
            {% set ns.b = ns.b + [{
              'action': 'URI',
              'title': state_attr(e, 'friendly_name'),
              'uri': 'deep-link://hado://list/' ~ e}] %}
          {% endfor %}
        {% endif %}
        {{ ns.b }}
  - alias: Send the notification
    device_id: !input notify_device
    domain: mobile_app
    type: notify
    title: "{{ place }}"
    message: "{{ summary | trim }}"
    data:
      tag: "todo-{{ place | slugify }}"
      clickAction: "deep-link://hado://list/{{ active_lists[0] }}"
      actions: "{{ buttons }}"
